<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or "Network Backup GUI Pro" }}</title>

  <!-- GitHub Primer CSS -->
  <link href="https://unpkg.com/@primer/css@21.0.9/dist/primer.css" rel="stylesheet">
  <link rel="icon" href="https://github.githubassets.com/favicons/favicon.png" type="image/png">

  <style>
    :root {
      --site-max-width: 1100px;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background-color: var(--color-canvas-default);
      color: var(--color-fg-default);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header */
    .Header {
      background-color: var(--color-header-bg, #0d1117);
      border-bottom: 1px solid var(--color-border-default);
      padding: 0.5rem 0;
    }

    .site-wrap {
      width: 100%;
      max-width: var(--site-max-width);
      margin: 0 auto;
      padding: 0 1rem;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--color-fg-default);
      text-decoration: none;
      font-weight: 600;
      white-space: nowrap;
    }

    .brand-link svg {
      display: inline-block;
      vertical-align: middle;
    }

    .nav-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    /* main content container */
    main.container-lg {
      width: 100%;
      max-width: var(--site-max-width);
      margin: 2rem auto;
      padding: 0 1rem;
      box-sizing: border-box;
      flex: 1 0 auto;
    }

    /* Footer */
    footer.site-footer {
      margin-top: 2rem;
      padding: 1rem 0;
      text-align: center;
      color: var(--color-fg-muted);
      font-size: 0.9rem;
    }

    /* Small helpers */
    .btn-ghost {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.06);
      color: var(--color-fg-default);
    }

    @media (max-width: 720px) {
      .site-wrap { padding-left: 0.75rem; padding-right: 0.75rem; }
      .nav-actions { gap: 0.35rem; }
      .brand-link span { font-size: 0.95rem; }
    }
  </style>
</head>

<body>
  <!-- top navigation -->
  <header class="Header" role="banner" aria-label="Top navigation">
    <div class="site-wrap">
      <a class="brand-link" href="/">
        <svg height="28" viewBox="0 0 16 16" version="1.1" width="28" class="octicon octicon-mark-github" aria-hidden="true" focusable="false">
          <path fill="currentColor" fill-rule="evenodd"
            d="M8 0C3.58 0 0 3.58 0 8a8.013 8.013 0 0 0 5.47 7.59c.4.075.55-.175.55-.388 
             0-.19-.007-.693-.01-1.36-2.23.485-2.7-1.074-2.7-1.074C3 12.63 2.47 12.4 
             2.47 12.4c-.726-.497.055-.487.055-.487.803.056 1.226.825 1.226.825.714 
             1.223 1.872.87 2.33.666.072-.517.28-.87.508-1.07-1.78-.2-3.64-.89-3.64-3.96 
             0-.875.31-1.59.823-2.15-.083-.202-.357-1.017.078-2.12 0 0 .67-.215 
             2.2.82A7.56 7.56 0 0 1 8 4.68a7.56 7.56 0 0 1 2.13.29c1.53-1.035 
             2.2-.82 2.2-.82.435 1.103.161 1.918.079 2.12.513.56.823 
             1.275.823 2.15 0 3.08-1.87 3.76-3.65 3.96.288.25.54.738.54 
             1.486 0 1.073-.01 1.938-.01 2.202 0 .214.15.464.55.387A8.013 
             8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"></path>
        </svg>
        <span>Network Backup GUI Pro</span>
      </a>

      <div class="nav-actions" role="navigation" aria-label="User actions">
        <a href="/upgrade" class="btn btn-sm btn-primary" title="Upgrade">Upgrade</a>
        <a href="/logout" class="btn btn-sm btn-ghost" title="Logout">Logout</a>
      </div>
    </div>
  </header>

  <!-- main page container -->
  <main class="container-lg" role="main">
    {% block content %}
    <!-- Page content will be injected here by templates -->
    {% endblock %}
  </main>

  <footer class="site-footer" role="contentinfo">
    <p>© {{ year or 2025 }} Network Backup GUI Pro — Styled with GitHub Primer</p>
  </footer>
</body>
</html>
